<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI-Accounts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
        }

        .navbar-brand {
            font-weight: 700;
            color: #0f172a;
        }

        .page-wrapper {
            background: #f8fafc;
        }

        .nav-link-title {
            font-weight: 500;
        }

        .card {
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
        }

        .ai-badge {
            background: #f3e8ff;
            color: #7c3aed;
            border: 1px solid #ddd6fe;
        }

        .status-success {
            color: #16a34a;
        }

        .status-warning {
            color: #d97706;
        }

        .status-error {
            color: #dc2626;
        }

        .review-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(4px);
    z-index: 1040;
    display: none;
}

.review-drawer {
    position: fixed;
    top: 0;
    right: -520px;
    width: 520px;
    height: 100vh;
    background: #ffffff;
    border-left: 1px solid #e2e8f0;
    z-index: 1050;
    box-shadow: -8px 0 24px rgba(15, 23, 42, 0.18);
    transition: right 0.25s ease;
    display: flex;
    flex-direction: column;
}

.review-drawer.open {
    right: 0;
}

.review-backdrop.show {
    display: block;
}

.review-drawer-header {
    padding: 18px 22px;
    border-bottom: 1px solid #e2e8f0;
}

.review-drawer-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
}

.review-drawer-footer {
    padding: 16px 20px;
    border-top: 1px solid #e2e8f0;
    background: #f8fafc;
}

.review-field {
    margin-bottom: 16px;
}

.review-field label {
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
}

@media(max-width: 700px) {
    .review-drawer {
        width: 100%;
        right: -100%;
    }
}
    </style>
</head>

<body>
<div class="page">

    <aside class="navbar navbar-vertical navbar-expand-lg">
        <div class="container-fluid">

            <h1 class="navbar-brand navbar-brand-autodark">
                AI-Accounts
            </h1>

            <div class="collapse navbar-collapse show">
                <ul class="navbar-nav pt-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <span class="nav-link-title">Dashboard</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/extraction">
                            <span class="nav-link-title">Document Extraction</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/validation">
                            <span class="nav-link-title">Validation Queue</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/history">
                            <span class="nav-link-title">History</span>
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </aside>

    <div class="page-wrapper">

        <header class="navbar navbar-expand-md d-print-none">
            <div class="container-xl">

                <div class="navbar-nav flex-row order-md-last">
                    <a href="/extraction" class="btn btn-primary">
                        Quick Upload
                    </a>

                    <div class="nav-item ms-3">
                        <span class="badge bg-blue-lt">Admin</span>
                    </div>
                </div>

                <div class="navbar-nav">
                    <div class="input-icon">
                        <input type="text" class="form-control" placeholder="Search documents, vouchers, vendors...">
                    </div>
                </div>

            </div>
        </header>

        <div class="page-body">
            <div class="container-xl">
                {% block content %}
                {% endblock %}
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
</body>
</html>
