<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accounts OCR Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: #e5e7eb;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeDown 0.8s ease;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            color: #38bdf8;
        }

        .header p {
            color: #94a3b8;
        }

        .card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            animation: fadeUp 0.8s ease;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: #e5e7eb;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #22c55e);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(34,197,94,0.25);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 22px;
            padding: 14px;
            border-radius: 10px;
            background: #020617;
            border-left: 4px solid #38bdf8;
            color: #cbd5e1;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 1s linear infinite;
        }

        .results {
            margin-top: 30px;
            display: none;
            animation: fadeUp 0.6s ease;
        }

        .section-title {
            color: #38bdf8;
            margin-top: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 15px;
        }

        .field-card {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
        }

        .field-label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .field-value {
            font-size: 16px;
            color: #f8fafc;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #064e3b;
            color: #86efac;
            font-size: 13px;
            margin-top: 8px;
        }

        .text-output {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            color: #d1d5db;
            white-space: pre-wrap;
            max-height: 320px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .log-box {
            background: #111827;
            border: 1px dashed #475569;
            border-radius: 12px;
            padding: 14px;
            color: #cbd5e1;
            margin-top: 12px;
        }

        .error {
            border-left-color: #ef4444;
            color: #fecaca;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>Accounts OCR Intelligence</h1>
        <p>Upload invoice, voucher, receipt, challan or accounting document</p>
    </div>

    <div class="card">
        <form id="uploadForm">
            <label>Document Type</label>
            <select name="model_id">
                <option value="auto">Auto Detect</option>
                <option value="voucher">Cash Payment Voucher</option>
                <option value="invoice">Invoice</option>
                <option value="receipt">Receipt</option>
                <option value="challan">Delivery Challan</option>
            </select>

            <label>Upload PDF or Image</label>
            <input type="file" name="document" accept=".pdf,.png,.jpg,.jpeg,.tiff,.bmp" required>

            <button id="submitBtn" type="submit">Extract Document</button>
        </form>

        <div id="status" class="status">Waiting for upload...</div>
        <div id="loader" class="loader"></div>

        <div id="results" class="results">
            <h3 class="section-title">Document Classification</h3>
            <div class="grid" id="classificationGrid"></div>

            <h3 class="section-title">Extracted Structured Fields</h3>
            <div class="grid" id="fieldsGrid"></div>

            <h3 class="section-title">Plain OCR Text</h3>
            <div id="textOutput" class="text-output"></div>

            <h3 class="section-title">Saved Log Files</h3>
            <div id="logFiles" class="log-box"></div>
        </div>
    </div>
</div>

<script>
const form = document.getElementById("uploadForm");
const statusBox = document.getElementById("status");
const loader = document.getElementById("loader");
const results = document.getElementById("results");
const submitBtn = document.getElementById("submitBtn");

const classificationGrid = document.getElementById("classificationGrid");
const fieldsGrid = document.getElementById("fieldsGrid");
const textOutput = document.getElementById("textOutput");
const logFiles = document.getElementById("logFiles");

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    statusBox.className = "status";
    statusBox.innerText = "Processing document with Azure OCR...";
    loader.style.display = "block";
    results.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.innerText = "Processing...";

    classificationGrid.innerHTML = "";
    fieldsGrid.innerHTML = "";
    textOutput.innerText = "";
    logFiles.innerHTML = "";

    try {
        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            statusBox.className = "status error";
            statusBox.innerText = "OCR failed. Check logs/errors folder.";
            textOutput.innerText = data.error || "Unknown error";
            results.style.display = "block";
            return;
        }

        statusBox.innerText = "OCR completed successfully. Structured output generated and saved in logs.";
        renderStructuredOutput(data);

    } catch (error) {
        statusBox.className = "status error";
        statusBox.innerText = "Request failed.";
        textOutput.innerText = error.toString();
        results.style.display = "block";

    } finally {
        loader.style.display = "none";
        submitBtn.disabled = false;
        submitBtn.innerText = "Extract Document";
    }
});

function renderStructuredOutput(data) {
    const structured = data.structured_output || {};
    const classification = structured.classification || {};
    const fields = structured.fields || {};
    const logs = data.log_files || {};

    results.style.display = "block";

    addField(classificationGrid, "Document Type", classification.document_type || "Unknown");
    addField(classificationGrid, "Confidence", classification.confidence || "N/A");
    addField(classificationGrid, "Reason", classification.reason || "N/A");

    Object.keys(fields).forEach(key => {
        addField(fieldsGrid, formatLabel(key), fields[key] ?? "Not detected");
    });

    if (Object.keys(fields).length === 0) {
        addField(fieldsGrid, "Status", "No structured fields detected");
    }

    textOutput.innerText = data.extracted_text || "No OCR text extracted";

    logFiles.innerHTML = `
        <div><strong>Raw JSON:</strong> ${logs.raw_json || "Not saved"}</div>
        <div><strong>Clean JSON:</strong> ${logs.clean_json || "Not saved"}</div>
        <div><strong>Text Log:</strong> ${logs.text_log || "Not saved"}</div>
        <div><strong>Structured JSON:</strong> ${logs.structured_json || "Check logs/structured folder"}</div>
    `;
}

function addField(container, label, value) {
    const card = document.createElement("div");
    card.className = "field-card";

    card.innerHTML = `
        <div class="field-label">${label}</div>
        <div class="field-value">${value}</div>
    `;

    container.appendChild(card);
}

function formatLabel(key) {
    return key
        .replaceAll("_", " ")
        .replace(/\b\w/g, char => char.toUpperCase());
}
</script>

</body>
</html>
